[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-companion-kit"
version = "0.13.1"
description = "Six-layer personal AI companions: memory, model-appraised emotion, virtual life, expression and private inheritance"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
embeddings = ["onnxruntime==1.29.0", "tokenizers==0.23.1", "numpy>=1.26.4,<3"]

[project.scripts]
memory-bridge = "memory_bridge.cli:main"
personal-brain = "personal_bot.cli:main"

[tool.setuptools.packages.find]
include = ["memory_bridge*", "personal_bot*"]
exclude = ["personal_bot.runtime.tests*"]

[tool.setuptools.package-data]
personal_bot = ["provenance.json"]
"personal_bot.runtime" = ["*.json", "*.mjs", "*.txt"]
"personal_bot.runtime.muse_ext" = ["*.html"]
