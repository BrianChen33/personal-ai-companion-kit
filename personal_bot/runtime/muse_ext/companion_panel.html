<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#fafafa">
<title>伙伴的云端小屋 · Muse</title>
<style>
:root {
  color-scheme: light;
  --paper: #fafafa;
  --card: #ffffff;
  --ink: #25272c;
  --muted: #686d76;
  --line: #e5e7eb;
  --green: #486357;
  --mint: #f1f5f2;

  --purple: #797088;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { color: inherit; cursor: pointer; border: 0; touch-action: manipulation; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
a { color: var(--green); text-underline-offset: 3px; overflow-wrap: anywhere; }
svg { display: block; flex: none; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3, h4, p { margin: 0; }
::selection { background: #dce9e0; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 172px; padding: 30px 16px 22px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: #f4f5f5; }
.brand { display: flex; align-items: center; gap: 9px; margin: 0 10px 34px; }
.brand-mark { color: var(--green); }
.brand-title { font-size: 14px; font-weight: 600; }
.nav { display: grid; gap: 4px; }
.nav-button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; border-radius: 7px; color: var(--muted); background: transparent; text-align: left; }
.nav-button .icon { width: 17px; height: 17px; }
.nav-button.active, .nav-button:hover { color: var(--ink); background: #e7eae8; }
.sidebar-bottom { margin-top: auto; padding: 12px; }
.side-about, .footer-button { padding: 4px 0; background: transparent; color: var(--muted); font-size: 12px; }
.main { max-width: 1400px; margin-left: 172px; padding: 38px 36px 24px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
.page-identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
h1 { font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -.025em; overflow-wrap: anywhere; }
.current-activity { margin-top: 5px; color: var(--muted); font-size: 12px; }
.top-meta { display: grid; gap: 2px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.snapshot-time { font-size: 12px; }
.snapshot-date { color: var(--muted); font-size: 11px; }
.home-room {
  position: relative;
  display: grid;
  place-items: center;
  margin-bottom: 20px;
  padding: 13px 20px 18px;
  overflow: hidden;
  border: 1px solid #e8e1d5;
  border-radius: 16px;
  background: #f6f3ec;
}
.room-scene { position: relative; width: min(100%, 680px); aspect-ratio: 520 / 230; }
.room-art { display: block; width: 100%; height: 100%; }
.room-scene .room-character {
  position: absolute;
  left: 27.7%; top: 21.7%; width: 29.6%; height: 65.2%;
  display: grid; place-items: center; padding: 0;
  border-radius: 12px; background: transparent; mix-blend-mode: multiply;
}
.room-character img { width: 100%; height: 100%; object-fit: contain; }
.room-character:hover { transform: translateY(-2px) rotate(-2deg); }
.room-object { position: absolute; display: flex; align-items: flex-end; justify-content: center; min-width: 40px; min-height: 40px; padding: 0; border-radius: 9px; background: transparent; }
.room-object:hover, .room-object:focus-visible { background: #d4dcc52b; }
.room-object span { position: absolute; bottom: 0; opacity: 0; padding: 2px 6px; border-radius: 5px; background: #fffaf0; color: #5d6657; font-size: 10px; white-space: nowrap; }
.room-object:hover span, .room-object:focus-visible span { opacity: 1; }
.rice-object { left: 4.5%; top: 51%; width: 18%; height: 40%; }
.diary-object { left: 19.8%; top: 71%; width: 12%; height: 23%; }
.hammock-object { left: 61.8%; top: 47%; width: 29.4%; height: 45%; }
.window-object { left: 66.5%; top: 12%; width: 24%; height: 33%; }
.bookshelf-object { left: 5%; top: 23%; width: 18%; height: 33%; }
.room-gallery { position: absolute; right: 17px; bottom: 12px; padding: 3px 6px; border-radius: 5px; background: transparent; color: #6f7267; font-size: 11px; }
.room-gallery:hover { background: #eae6dc; }
.room-moon-cutout { opacity: 0; fill: #536c80; }
.room-lamp-glow { opacity: .07; }
body[data-room-period="evening"] .room-sky { fill: #e8c5ae; }

body[data-room-period="night"] .room-lamp-glow { opacity: .3; }
.reduced-art { display: none; width: 80%; height: 80%; align-items: center; justify-content: center; border-radius: 50%; color: var(--green); background: #e9eddb; }
.reduced-art .icon { width: 54%; height: 54%; }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; min-width: 0; min-height: 168px; padding: 19px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); text-align: left; transition: border-color .15s ease, background .15s ease; }
.card:hover { border-color: #b8c6bd; background: #fdfefd; }
.card-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
.icon-tile { display: grid; place-items: center; color: var(--green); }
.icon-tile .icon { width: 16px; height: 16px; }
.card-arrow { width: 13px; height: 13px; margin-left: auto; color: #8a9098; }

.metric-word { font-size: 25px; letter-spacing: -.02em; }
.metric .unit { margin-left: 5px; color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: 0; }
.card-description { margin-top: 7px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.card-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; color: var(--muted); font-size: 11px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 5px; background: var(--mint); color: var(--green); font-size: 10px; line-height: 1.5; }
.pill.rose { color: var(--rose); background: var(--pink); }
.pill.gold { color: var(--gold); background: var(--yellow); }
.pill.purple { color: var(--purple); background: var(--lilac); }
.track { width: 100%; height: 4px; overflow: hidden; border-radius: 4px; background: #edf0ee; }
.track > i { display: block; height: 100%; width: var(--value); border-radius: inherit; background: #8aa395; }
.energy-lines { display: flex; gap: 8px; width: 100%; }
.energy-line { flex: 1; min-width: 0; }
.energy-line span { display: flex; justify-content: space-between; gap: 3px; margin-bottom: 5px; font-size: 10px; }
.life-note { display: flex; justify-content: space-between; gap: 8px; width: 100%; font-size: 10px; }
.life-progress { height: 4px; overflow: hidden; margin-top: 18px; border-radius: 4px; background: #edf0ee; }
.life-progress i { display: block; height: 100%; width: 0; background: #8aa395; }
.avatar-stack { display: flex; align-items: center; }
.avatar { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border: 2px solid var(--card); border-radius: 50%; background: #eaf0ec; color: var(--green); font-size: 11px; }
.avatar + .avatar { margin-left: -5px; }
.avatar.pink { color: var(--rose); background: var(--pink); }
.avatar.gray { background: #eef0f2; color: var(--muted); }
.switch-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.switches-card .metric { font-size: 24px; }
.fine-divider { width: 1px; height: 10px; background: var(--line); }
.page-footer { display: flex; justify-content: flex-end; padding-top: 20px; }
.detail-dialog { position: fixed; inset: 16px 16px 16px auto; width: min(600px, calc(100vw - 32px)); height: calc(100dvh - 32px); max-width: none; max-height: none; margin: 0; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); box-shadow: 0 16px 60px #25272c24; }
.detail-dialog[open] { display: flex; flex-direction: column; }
.detail-dialog::backdrop { background: #20242b35; }
.dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: none; padding: 22px 24px; border-bottom: 1px solid var(--line); }
.dialog-header h2 { font-size: 20px; font-weight: 600; }
.close-button { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: 7px; color: var(--muted); background: #f2f3f4; }
.close-button .icon { width: 16px; height: 16px; }
.dialog-body { flex: 1; min-height: 0; padding: 24px; overflow: auto; overflow-wrap: anywhere; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #ced5d0 transparent; }
.dialog-footer { flex: none; padding: 12px 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.detail-lead, .detail-text { color: var(--muted); font-size: 12px; line-height: 1.75; }
.detail-lead { margin-bottom: 20px; }
.detail-hero { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px; margin-bottom: 22px; border: 1px solid var(--line); border-radius: 10px; background: #f7f9f7; }
.hero-label, .hero-sub { color: var(--muted); font-size: 11px; }
.hero-value { margin: 5px 0; font-size: 28px; line-height: 1.3; font-weight: 550; }
.hero-icon { width: 36px; height: 36px; color: #82988a; }
.detail-section { margin-top: 26px; }
.detail-section:first-child { margin-top: 0; }
.detail-section h3 { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
.detail-section h3 small { color: var(--muted); font-size: 10px; font-weight: 400; }
.detail-note, .status-note { padding: 12px 14px; margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: #f8f9f8; font-size: 11px; line-height: 1.8; }
.number-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.stat-label, .stat-note { color: var(--muted); font-size: 10px; }
.stat-value { margin: 5px 0 9px; font-size: 23px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.stat-note { margin-top: 7px; }
.list-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.list-row:last-child { border-bottom: 0; }
.row-label { min-width: 0; color: var(--muted); }
.row-value { min-width: 0; max-width: 62%; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.list-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }
.detail-chip-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
.search-row { display: flex; gap: 8px; margin: 12px 0 16px; }
.search-box { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; padding: 9px 10px; border: 1px solid #d9dde1; border-radius: 7px; background: var(--card); }
.search-box .icon { width: 15px; height: 15px; color: var(--muted); }
.search-box input { width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--ink); outline: 0; font-size: 12px; }
.search-box:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
.search-box input:focus-visible { outline: 0; }
.filter-select { max-width: 150px; min-width: 0; padding: 8px; border: 1px solid #d9dde1; border-radius: 7px; color: var(--ink); background: var(--card); font-size: 11px; }
.emotion-list { display: grid; gap: 2px; }
.emotion-row { display: grid; grid-template-columns: 20px 62px 1fr 44px; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid #eff1f2; font-size: 12px; }
.rank, .emotion-pct { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.emotion-pct { text-align: right; }
.emotion-count, .emotion-meta, .group-legend { color: var(--muted); font-size: 10px; font-weight: 400; }
.emotion-meta { margin-top: 12px; line-height: 1.8; }
.group-legend { display: flex; flex-wrap: wrap; gap: 9px 12px; margin-top: 16px; }
.group-legend i { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--group-color); }
.expectation-card, .person-card { padding: 16px; margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; }
.expectation-kind, .expectation-card small { color: var(--muted); font-size: 10px; }
.expectation-card p { margin: 8px 0; font-size: 12px; }
.timeline { padding-left: 16px; margin-left: 4px; border-left: 1px solid var(--line); }
.timeline-item { position: relative; padding-bottom: 22px; }
.timeline-item::before { content: ""; position: absolute; top: 7px; left: -20px; width: 7px; height: 7px; border-radius: 50%; background: #8aa395; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.timeline-title { font-size: 12px; font-weight: 500; }
.timeline-head time { margin-left: auto; color: var(--muted); font-size: 10px; }
.timeline-item p { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.life-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.life-overview > section { min-width: 0; margin-top: 0; }
.day-intentions { padding: 0; margin: 0; list-style: none; }
.day-intention { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.day-intention:first-child { border-top: 0; }
.day-intention time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.day-intention p { margin: 0; overflow-wrap: anywhere; font-size: 12px; }

.day-intention.active { border-left: 2px solid var(--green); padding-left: 8px; }

.life-more { display: block; margin: 16px auto 0; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.person-heading { display: flex; align-items: center; gap: 9px; }
.person-name { font-size: 14px; font-weight: 550; }
.person-role, .person-level { color: var(--muted); font-size: 10px; }
.person-level { margin-left: auto; }
.person-numbers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.person-numbers span, .person-note { color: var(--muted); font-size: 11px; }
.person-numbers b { display: block; margin: 3px 0 7px; font-size: 20px; font-weight: 500; }
.person-note { margin-top: 12px; line-height: 1.8; }
.readonly-switch { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 11px; }
.switch-visual { position: relative; width: 25px; height: 14px; border-radius: 12px; background: #708f7c; }

.setting-command { white-space: pre-line; color: var(--muted); font-size: 12px; }
.schedule { display: flex; align-items: center; gap: 16px; padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 9px; }
.schedule-clock { font-size: 22px; font-variant-numeric: tabular-nums; }
.schedule-label { color: var(--muted); font-size: 10px; }
.schedule-result { margin-left: auto; }
.empty-message, .keyword-empty { padding: 22px 0; color: var(--muted); font-size: 12px; text-align: center; }
.detail-grid-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.source-label { margin-top: 7px; color: var(--muted); font-size: 10px; }
.scene-preview-stage { display: flex; align-items: center; gap: 20px; margin-bottom: 22px; }

.scene-mood-choice.selected { border-color: var(--green); color: var(--green); background: var(--mint); }
.mood-sticker-inline { width: 76px; height: 76px; object-fit: contain; }
.credits { color: var(--muted); font-size: 11px; line-height: 1.9; }
.credits p + p { margin-top: 5px; }
.keyword-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.keyword-filter { display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--muted); font-size: 11px; }

.keyword-groups { max-height: 320px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.keyword-group + .keyword-group { margin-top: 18px; }
.keyword-group h4 { display: flex; gap: 8px; margin-bottom: 9px; font-size: 12px; font-weight: 550; }
.keyword-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }
.keyword-chip { max-width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #f8f9f8; font-size: 12px; overflow-wrap: anywhere; }

details { margin-top: 14px; }
summary { cursor: pointer; font-size: 12px; }

<script>
'use strict';
const snapshot=JSON.parse(document.getElementById('snapshot').textContent);
const catalog=snapshot.emotion_catalog;
const $=id=>document.getElementById(id);
const dialog=$('detail-dialog'),body=$('dialog-body');
const groupColors=['#99b17f','#c59a88','#a0b5a0','#b3a4c1','#c5ae7b','#a2b2c0'];
const groupNames=Object.keys(catalog.groups);
const labelGroup=new Map(groupNames.flatMap((g,i)=>catalog.groups[g].map(label=>[label,{name:g,index:i,color:groupColors[i]}])));
const emotionValues=new Map((snapshot.mood?.labels||[]).map(x=>[x.label,x.intensity]));
const rankedEmotions=catalog.labels.map((label,index)=>({label,index,intensity:emotionValues.has(label)?emotionValues.get(label):null,...labelGroup.get(label)})).sort((a,b)=>(b.intensity??-1)-(a.intensity??-1)||a.index-b.index);
const controls=snapshot.expression_settings?.values||{};
const switchDefinitions=[['auto_memes','自动玩梗','自动思考梗'],['banter_enabled','主动串子','主动串子'],['counterattack_enabled','独立反击','被攻击后反击'],['self_learning','语境学习','语境学习与纠错'],['meme_sync_enabled','词库周更','公共梗库每周更新']];
const activeEmotions=rankedEmotions.filter(e=>typeof e.intensity==='number'&&e.intensity>0);
let focusedBeforeDialog=null;

const homeStickers=snapshot.panel_art;
let homeStickerKey='happy';
const stickerDisplayNames={happy:'开心',curious:'好奇',relaxed:'放松',sad:'低落',angry:'生气',tired:'困困',affection:'想贴贴',reading:'读书'};
function chooseHomeSticker(){const label=activeEmotions[0]?.label;if(!label)return 'relaxed';const energy=snapshot.companion?.energy||{};if(typeof energy.physical==='number'&&typeof energy.mental==='number'&&(energy.physical+energy.mental)/2<30)return 'tired';if(['难过','失落','委屈','孤单','沮丧','失望','遗憾','内疚','后悔','羞愧','害怕','不安','紧张','担忧'].includes(label))return 'sad';if(['生气','烦躁','不满','无奈','懊恼'].includes(label))return 'angry';if(['喜爱','亲近','想念','依恋','关切','心疼','害羞','受宠若惊','感动','感激'].includes(label))return 'affection';if(['好奇','期待','兴奋','惊讶'].includes(label))return 'curious';if(['专注','困惑','纠结'].includes(label))return 'reading';if(['平静','放松','安心','释然','满足','无聊'].includes(label))return 'relaxed';return 'happy'}
function setHomeSticker(key, preview = false) {
  const asset = homeStickers.items[key];
  if (!asset) return;
  homeStickerKey = key;
  const image = $('house-sticker');
  image.src = asset.data_uri;
  image.alt = (preview ? '表情预览 · ' : '当前表情 · ') + stickerDisplayNames[key];
}

function renderHomeExpressions() {
  const stage = node('div', null, 'scene-preview-stage');
  const image = node('img');
  const copy = node('div');
  const title = node('strong');
  const description = node('p');
  copy.append(title, description);
  stage.append(image, copy);
  body.append(stage);
  const choices = node('div', null, 'scene-mood-list');
  const order = ['happy', 'curious', 'affection', 'relaxed', 'sad', 'angry', 'tired', 'reading'];
  function select(key) {
    const asset = homeStickers.items[key];
    image.src = asset.data_uri;
    image.alt = stickerDisplayNames[key] + '的伙伴表情';
    title.textContent = stickerDisplayNames[key];
    description.textContent = asset.caption;
    for (const button of choices.children) {
      const selected = button.dataset.key === key;
      button.classList.toggle('selected', selected);
      button.setAttribute('aria-pressed', String(selected));
    }
    setHomeSticker(key, true);
  }
  for (const key of order) {
    const button = node('button', stickerDisplayNames[key], 'scene-mood-choice');
    button.dataset.key = key;
    button.addEventListener('click', () => select(key));
    choices.append(button);
  }
  body.append(choices);
  select(homeStickerKey);
  const reset = node('button', '当前心情', 'scene-mood-choice');
  reset.style.marginTop = '18px';
  reset.addEventListener('click', () => {
    const current = chooseHomeSticker();
    select(current);
    setHomeSticker(current);
  });
  body.append(reset);
}

function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=text;if(cls)e.className=cls;return e}
function icon(name,extra=''){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','icon '+extra);svg.setAttribute('aria-hidden','true');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#i-'+name);svg.append(use);return svg}
function append(parent,...children){parent.append(...children);return parent}
function number(value,digits=0){return typeof value==='number'&&Number.isFinite(value)?value.toLocaleString('zh-CN',{maximumFractionDigits:digits}):'—'}
function percent(value){return typeof value==='number'&&Number.isFinite(value)?Math.round(value*100)+'%':'未记录'}
function time(ts){return typeof ts==='number'?new Date(ts*1000).toLocaleTimeString('zh-CN',{timeZone:snapshot.timezone||'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}):'—'}
function track(value,color,min=0,max=100){const t=node('div',null,'track'),fill=node('i');fill.style.setProperty('--value',typeof value==='number'?Math.max(0,Math.min(100,(value-min)/(max-min)*100))+'%':'0%');if(color)fill.style.background=color;t.append(fill);return t}
function setMetric(id,value,unit){const e=$(id);e.replaceChildren(document.createTextNode(number(value)));if(unit)e.append(node('span',unit,'unit'))}

function relationLevel(score){return typeof score!=='number'?'尚未评估':score>=85?'很亲近':score>=65?'亲近':score>=45?'熟悉':score>=25?'有些距离':'疏远'}
function renderRoomClock(generated) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: snapshot.timezone || 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(generated).split(':').map(Number);
  const [hour, minute] = parts;
  const period = hour >= 19 || hour < 7 ? 'night' : hour >= 17 ? 'evening' : 'day';
  document.body.dataset.roomPeriod = period;
  $('room-hour-hand').setAttribute('transform', `rotate(${hour % 12 * 30 + minute / 2} 294 42)`);
  $('room-minute-hand').setAttribute('transform', `rotate(${minute * 6} 294 42)`);
}

function renderOverview() {
  const companion = snapshot.companion || {};
  const energy = companion.energy || {};

    ? (energy.physical + energy.mental) / 2 : null;
  const generated = new Date(snapshot.generated_at * 1000);
  renderRoomClock(generated);

  $('snapshot-time').dateTime = generated.toISOString();
  $('snapshot-date').textContent = generated.toLocaleDateString('zh-CN', {

  $('mood-title').textContent = moodWord();
  $('mood-subtitle').textContent = activeEmotions.slice(1, 3)
    .map(item => item.label + ' ' + percent(item.intensity)).join(' · ');
  setMetric('energy-value', average, '/ 100');
  const energyLines = node('div', null, 'energy-lines');
  for (const [key, label] of [['physical', '体力'], ['mental', '脑力'], ['social', '社交']]) {
    const line = node('div', null, 'energy-line');
    const heading = node('span');

  const expectations = companion.pending_expectations?.length || 0;

  const activity = companion.activity;
  $('activity-title').textContent = activity?.name ? activity.name + '中' : '自由时间';
  const scenePlace = companion.day_scene?.fields?.location;
  $('activity-start').textContent = [scenePlace, activity ? time(activity.started_at) + ' 开始' : ''].filter(Boolean).join(' · ');

      (snapshot.generated_at - activity.started_at) / (activity.ends_at - activity.started_at) * 100));

  $('activity-progress').style.width = progress + '%';
  setMetric('memory-value', snapshot.counts?.memories, '条');

  $('relationship-title').textContent = relationLevel(companion.relationship?.affection);
  $('people-count').textContent = (snapshot.people?.length || 0) + ' 位联系';
  $('people-avatars').replaceChildren(...(snapshot.people || []).slice(0, 3)
    .map((person, index) => node('span', person.name.slice(0, 1), 'avatar ' + ['', 'pink', 'gray'][index])));

  const readingStates = {awaiting_sources: '待配置', awaiting_verification: '待验证', ready: '可阅读', disabled: '已暂停', unavailable: '异常'};
  $('plugin-state').textContent = reading ? (readingStates[reading.status] || '已安装') : '未安装';

    ? (reading.settings?.auto_browse === true ? '自动阅读已开启' : '自动阅读已关闭') : '';

    .filter(item => item.active && item.status === 'verified').length + ' 个来源';
